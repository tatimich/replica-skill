# Identidade da marca: aparece no site e no timbrado dos arquivos baixados (PDF e Word).
# Projeto neutro por enquanto. Para aplicar a marca, troque os valores abaixo
# e coloque o logo em marca/ (PNG ou JPG, fundo transparente de preferência).

[marca]
nome = "Biblioteca de Legislação"
subtitulo = "Educação Superior"
logo = ""                     # ex.: "marca/logo.png"
endereco = ""                 # ex.: "Rua Exemplo, 100, Cidade/UF"
contato = ""                  # ex.: "contato@exemplo.com.br  |  (00) 0000-0000"
site = ""                     # ex.: "www.exemplo.com.br"
cor_primaria = "#1F3A5F"
rodape = "Texto reproduzido para consulta. Confira sempre a publicação oficial."

[integracao]
# Sites autorizados a chamar a API JSON (CORS). Ex.: ["https://www.suamarca.com.br"]
cors_origens = []
# Sites autorizados a exibir a busca dentro de um iframe.
# Ex.: ["'self'", "https://www.suamarca.com.br"]
frame_ancestors = ["'self'"]
