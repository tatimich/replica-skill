# Identidade da marca: aparece no site e no timbrado dos arquivos baixados (PDF e Word).
# Dados e logo iguais aos do Monitor da Educação (repositório Monitor-da-Educacao_DOU_EM-Advocacia):
# config/monitor_dou.json (institution, branding) e assets/logo_esmeraldo_malheiros_timbrado.png.

[marca]
nome = "Esmeraldo Malheiros Advocacia"
subtitulo = "Biblioteca de Legislação"
logo = "marca/logo_esmeraldo_malheiros_timbrado.png"
logo_largura_mm = 58          # largura visual do logo no timbrado (igual ao Monitor)
logo_margem_topo_mm = 6       # margem superior do logo (igual ao Monitor)
endereco = ""
contato = "contato@esmeraldomalheiros.com.br"
site = "www.esmeraldomalheiros.com.br"
cor_primaria = "#07384a"      # azul da marca
cor_secundaria = "#c79a50"    # dourado da marca
rodape = "Texto reproduzido para consulta. Confira sempre a publicação oficial."

[integracao]
# Sites autorizados a chamar a API JSON (CORS).
cors_origens = ["https://www.esmeraldomalheiros.com.br", "https://esmeraldomalheiros.com.br"]
# Sites autorizados a exibir a busca dentro de um iframe.
frame_ancestors = ["'self'", "https://www.esmeraldomalheiros.com.br", "https://esmeraldomalheiros.com.br"]
